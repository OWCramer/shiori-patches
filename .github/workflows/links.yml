name: Check links
on:
  schedule:
    - cron: "41 3 * * 3"   # weekly
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: update
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - run: python tools/check_links.py | tee "$RUNNER_TEMP/links.txt"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Every link answered as before."; exit 0; fi
          BRANCH="links/$(date -u +%Y-%m-%d)"
          git config user.name "shiori-patches bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "Link check ($(date -u +%Y-%m-%d))"
          git push -f origin "$BRANCH"
          { echo '```'; cat "$RUNNER_TEMP/links.txt"; echo '```'; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "Link check ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
